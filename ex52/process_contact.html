<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin đăng nhập</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f7f7;
            font-family: Arial, sans-serif;
        }
        .contact-box {
            width: 500px;
            margin: 20px;
            padding: 20px;
            border: 1px solid rgb(212, 212, 236);
            box-shadow: 15px 0 30px rgba(0, 0, 0, 0.2);
            background: #fcfcb9;
            text-align: center;
        }
        .contact-box h2 {
            margin-bottom: 16px;
            font-size: 24px;
        }
        .contact-box p {
            margin: 10px 0;
            font-size: 18px;
        }
        .contact-box strong {
            color: #231616;
        }
        .contact-box a {
            display: inline-block;
            margin-top: 18px;
            color: #0077cc;
            text-decoration: none;
        }
        .contact-box p{
            color: rgb(255, 0, 0);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="contact-box">
        <h2>Contact Information</h2>
        <p><strong>Full Name:</strong> <span id="fullname">...</span></p>
        <p><strong>Email:</strong> <span id="email">...</span></p>
        <p><strong>Title:</strong> <span id="title">...</span></p>
        <p><strong>Content:</strong> <span id="content">...</span></p>
        <p><strong>Send to:</strong> <span id="Sendto">...</span></p>
        <a href="contact.html">Quay lại trang contact</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const fullname = params.get('fullname') || 'Không tìm thấy fullname';
        const email = params.get('email') || 'Không tìm thấy email';
        const title = params.get('title') || 'Không tìm thấy title';
        const content = params.get('content') || 'Không tìm thấy content';
        const sendto = params.get('Sendto') || 'Không tìm thấy';
        document.getElementById('fullname').textContent = fullname;
        document.getElementById('email').textContent = email;
        document.getElementById('title').textContent = title;
        document.getElementById('content').textContent = content;
        document.getElementById('Sendto').textContent = sendto;
    </script>
</body>
</html>
